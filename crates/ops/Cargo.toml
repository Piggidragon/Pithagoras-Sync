[package]
name = "sync-ops"
description = "Device-side operations of Pithagoras Sync: files, grep, find, exec."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sync-proto.workspace = true
sync-policy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
ring.workspace = true
ignore.workspace = true
globset.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Exec tests need a shim binary; this test binary is its own shim, so it runs
# without the default harness.
[[test]]
name = "exec"
harness = false

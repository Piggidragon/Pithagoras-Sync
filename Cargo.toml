[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/policy",
    "crates/ops",
    "crates/connector",
    "crates/testkit",
    "crates/pithagoras-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Piggidragon/Pithagoras-Sync"
rust-version = "1.88"

[workspace.dependencies]
sync-proto = { path = "crates/proto" }
sync-policy = { path = "crates/policy" }
sync-ops = { path = "crates/ops" }
sync-connector = { path = "crates/connector" }
sync-testkit = { path = "crates/testkit" }

tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "signal", "fs"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
ring = "0.17"
base64 = "0.22"
libc = "0.2"
regex = "1"
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
landlock = "0.4"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Console"] }
minisign-verify = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

# A release: on a version tag (v0.1.0), check the workspace, build the static musl
# Linux binaries (x86_64, aarch64) and the Windows x86_64 program with the release
# key's public half compiled in, then publish them as a GitHub Release with
# SHA256SUMS and manifest.json signed by the release key. `pithagoras-sync update`
# reads that manifest from the newest release (the stable channel).
#
# One-time setup by the repository owner (docs/releasing.md):
#   - repository variable PITHAGORAS_SYNC_UPDATE_KEY: the public key
#   - repository secret PITHAGORAS_SYNC_SIGNING_KEY: the secret key file's content
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Pinned, so a release builds the same way again.
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: never

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: The tag is the version in Cargo.toml
        run: |
          version=$(cargo pkgid -p pithagoras-sync | sed 's/.*[#@]//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME, Cargo.toml says $version" >&2
            exit 1
          fi
      - name: The release key is set up
        env:
          PUBLIC_KEY: ${{ vars.PITHAGORAS_SYNC_UPDATE_KEY }}
          HAS_SECRET: ${{ secrets.PITHAGORAS_SYNC_SIGNING_KEY != '' }}
        run: |
          if [ -z "$PUBLIC_KEY" ] || [ "$HAS_SECRET" != true ]; then
            echo "set the variable PITHAGORAS_SYNC_UPDATE_KEY and the secret PITHAGORAS_SYNC_SIGNING_KEY (docs/releasing.md)" >&2
            exit 1
          fi
      # Tests are built without the release key: they sign with throwaway keys.
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  linux:
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # A native arm64 runner: no cross C compiler for ring needed.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
      BIN: pithagoras-sync-${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - name: A C compiler for musl (ring's C parts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        env:
          PITHAGORAS_SYNC_UPDATE_KEY: ${{ vars.PITHAGORAS_SYNC_UPDATE_KEY }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target "$TARGET" -p pithagoras-sync
          mkdir dist
          cp "target/$TARGET/release/pithagoras-sync" "dist/$BIN"
      - name: Static, and the version the tag names
        run: |
          file -b "dist/$BIN" | tee /dev/stderr | grep -Eq 'static(-pie)? linked|statically linked'
          said=$("dist/$BIN" --version)
          if [ "$said" != "pithagoras-sync ${GITHUB_REF_NAME#v}" ]; then
            echo "the binary says $said" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}
          path: dist/${{ env.BIN }}
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-2025
    env:
      TARGET: x86_64-pc-windows-msvc
      BIN: pithagoras-sync-x86_64-windows.exe
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      # .cargo/config.toml links the C runtime statically: a fresh Windows has no
      # VCRUNTIME140.dll.
      - name: Build
        env:
          PITHAGORAS_SYNC_UPDATE_KEY: ${{ vars.PITHAGORAS_SYNC_UPDATE_KEY }}
        run: |
          cargo build --release --locked --target "$TARGET" -p pithagoras-sync
          mkdir dist
          cp "target/$TARGET/release/pithagoras-sync.exe" "dist/$BIN"
      - name: No Visual C++ runtime, and the version the tag names
        run: |
          if grep -aqi 'vcruntime140' "dist/$BIN"; then
            echo "$BIN imports the Visual C++ runtime" >&2
            exit 1
          fi
          said=$("dist/$BIN" --version | tr -d '\r')
          if [ "$said" != "pithagoras-sync ${GITHUB_REF_NAME#v}" ]; then
            echo "the program says $said" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}
          path: dist/${{ env.BIN }}
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The manifest, its signature and the checksums
        env:
          PITHAGORAS_SYNC_SIGNING_KEY: ${{ secrets.PITHAGORAS_SYNC_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.PITHAGORAS_SYNC_UPDATE_KEY }}
        run: |
          cargo build --release --locked -p sync-release
          tool=$PWD/target/release/sync-release
          cd dist
          "$tool" manifest --version "${GITHUB_REF_NAME#v}" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --out manifest.json \
            pithagoras-sync-x86_64-linux=x86_64-linux \
            pithagoras-sync-aarch64-linux=aarch64-linux \
            pithagoras-sync-x86_64-windows.exe=x86_64-windows
          "$tool" sign --key-env PITHAGORAS_SYNC_SIGNING_KEY manifest.json
          # The secret must belong to the public key in the binaries, or no client
          # could take this release.
          "$tool" verify --public "$PUBLIC_KEY" manifest.json
          "$tool" sums --out SHA256SUMS pithagoras-sync-* manifest.json manifest.json.minisig
          cat manifest.json SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Pithagoras Sync ${GITHUB_REF_NAME#v}" \
            --notes "Static Linux binaries (x86_64, aarch64) and the Windows x86_64 program. \`pithagoras-sync update\` installs this release; SHA256SUMS lists the checksums, manifest.json.minisig signs the manifest (docs/releasing.md)." \
            dist/*
